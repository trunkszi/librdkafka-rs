[package]
name = "librdkafka-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Synchronous, thread-affine Rust Kafka producer, consumer, and admin client over librdkafka"

[lib]
name = "rdkafka"

[features]
default = []
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile"]
http = ["tls", "dep:nexora", "dep:sonic-rs"]
tracing = ["dep:tracing"]

[dependencies]
rdkafka-sys = { workspace = true }
cxx = { workspace = true }
libc = { workspace = true }
rdkafka-macros = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
zerocopy = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true, optional = true }

nexora = { workspace = true, optional = true }
sonic-rs = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }

[dev-dependencies]
rcgen = { workspace = true }
static_assertions = { workspace = true }

[lints]
workspace = true

[[example]]
name = "06_tls_http_schema_oauth"
required-features = ["http"]
