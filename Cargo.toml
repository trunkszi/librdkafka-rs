[workspace]
members = ["crates/rdkafka-sys", "crates/rdkafka-macros", "crates/rdkafka"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rdkafka-sys = { path = "crates/rdkafka-sys" }
rdkafka-macros = { path = "crates/rdkafka-macros" }
cxx = { version = "1.0" }
cxx-build = { version = "1.0" }
cmake = { version = "0.1" }
cc = { version = "1.2" }
thiserror = { version = "2.0" }
anyhow = { version = "1.0" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
libc = { version = "0.2" }
static_assertions = { version = "1.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
clone_on_copy = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
expl_impl_clone_on_copy = "deny"
non_canonical_clone_impl = "deny"
useless_conversion = "deny"
useless_asref = "deny"
to_string_in_format_args = "deny"
manual_string_new = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"
